      }

        opis.style.webkitBoxOrient = "";
        opis.style.webkitLineClamp = "";
        opis.style.overflow = "";
      }

      przytnij();
      if (opis.scrollHeight <= opis.clientHeight + 2) {
        rozwin(); // krótki opis - zostaje jak był
        return;
      }

    'use strict';

    var REMEMBER = true;
    var MODE = "menu";
    var HEADER_SELECTOR = ".top";
    var MENU_TOGGLE_LABEL = "Otwórz menu nawigacji";
    var STORAGE_KEY = 'wcagToolbarPrefs';
    var html = document.documentElement;

    var MODES = {
        hc:        { cls: 'wcag-hc',        on: 'Włączono tryb wysokiego kontrastu',  off: 'Wyłączono tryb wysokiego kontrastu' },
        text1:     { cls: 'wcag-text1',     on: 'Powiększono tekst',                  off: 'Przywrócono rozmiar tekstu' },
        text2:     { cls: 'wcag-text2',     on: 'Mocno powiększono tekst',            off: 'Przywrócono rozmiar tekstu' },
        readable:  { cls: 'wcag-readable',  on: 'Włączono czytelną typografię',       off: 'Wyłączono czytelną typografię' },
        underline: { cls: 'wcag-underline', on: 'Włączono podkreślanie linków',       off: 'Wyłączono podkreślanie linków' }
    };

    function save () {
        if (!REMEMBER) { return; }
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                hc: html.classList.contains('wcag-hc'),
                size: html.classList.contains('wcag-text2') ? 2 : (html.classList.contains('wcag-text1') ? 1 : 0),
                readable: html.classList.contains('wcag-readable'),
                underline: html.classList.contains('wcag-underline')
            }));
        } catch (e) {}
    }

    function announce (message) {
        var status = document.getElementById('wcag-status');
        if (status) {
            status.textContent = '';
            window.setTimeout(function () { status.textContent = message; }, 50);
        }
    }

    function syncButtons (root) {
        root.querySelectorAll('button[data-wcag]').forEach(function (btn) {
            var m = MODES[btn.getAttribute('data-wcag')];
            if (m) {
                btn.setAttribute('aria-pressed', html.classList.contains(m.cls) ? 'true' : 'false');
            }
        });
    }

    function handleToggle (btn, root) {
        var key = btn.getAttribute('data-wcag');
        if (key === 'reset') {
            Object.keys(MODES).forEach(function (k) { html.classList.remove(MODES[k].cls); });
            announce('Przywrócono ustawienia domyślne');
        } else if (key === 'text1' || key === 'text2') {
            var wasActive = html.classList.contains(MODES[key].cls);
            html.classList.remove('wcag-text1', 'wcag-text2');
            if (!wasActive) { html.classList.add(MODES[key].cls); }
            announce(wasActive ? MODES[key].off : MODES[key].on);
        } else if (MODES[key]) {
            var nowActive = html.classList.toggle(MODES[key].cls);
            announce(nowActive ? MODES[key].on : MODES[key].off);
        }
        syncButtons(root);
        save();
    }

    /* Zamyka mobilny sidebar motywu (klasy z scripts.js motywu) */
    function closeThemeSidebar () {
        var sidebar = document.querySelector('.navbar_mobile_sidebar');
        var overlay = document.querySelector('.navbar_mobile_sidebar__overlay');
        var toggle  = document.querySelector('.js-toggle');
        if (sidebar) { sidebar.classList.add('is-hidden'); }
        if (overlay) { overlay.classList.add('is-hidden'); }
        if (toggle) {
            toggle.classList.remove('is-active');
            toggle.setAttribute('aria-expanded', 'false');
        }
        document.documentElement.classList.remove('is-fixed');
        document.body.classList.remove('is-fixed');
    }

    function setupPanel () {
        var panel = document.getElementById('wcag-panel');
        if (!panel) { return; }
        var lastTrigger = null;

        function allTriggers () {
            return document.querySelectorAll('.wcag-trigger');
        }
        function setExpanded (value) {
            allTriggers().forEach(function (t) {
                t.setAttribute('aria-expanded', value ? 'true' : 'false');
            });
        }
        function openPanel (from) {
            lastTrigger = from || null;
            closeThemeSidebar(); /* panel zamiast sidebara, nie obok niego */
            panel.hidden = false;
            panel.classList.add('is-visible');
            setExpanded(true);
            var first = panel.querySelector('button');
            if (first) { first.focus(); }
        }
        function closePanel (refocus) {
            panel.classList.remove('is-visible');
            panel.hidden = true;
            setExpanded(false);
            if (refocus && lastTrigger && document.contains(lastTrigger)) {
                lastTrigger.focus();
            } else if (refocus) {
                var t = document.querySelector('.wcag-trigger, .js-toggle');
                if (t) { t.focus(); }
            }
        }

        /* Delegacja na poziomie dokumentu — działa też dla pozycji menu
           sklonowanej do sidebara przez skrypt motywu */
        document.addEventListener('click', function (e) {
            var trigger = e.target.closest('.wcag-trigger');
            if (trigger) {
                if (panel.hidden) { openPanel(trigger); } else { closePanel(false); }
                return;
            }
            var btn = e.target.closest('#wcag-panel button[data-wcag]');
            if (btn) {
                handleToggle(btn, panel);
                return;
            }
            /* Klik poza panelem zamyka */
            if (!panel.hidden && !panel.contains(e.target)) {
                closePanel(false);
            }
        });

        /* Escape zamyka i wraca fokusem (WCAG 2.1.2) */
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && !panel.hidden) { closePanel(true); }
        });

        syncButtons(panel);
    }

    function setupBar () {
        var bar = document.querySelector('.wcag-bar');
        if (!bar) { return; }
        bar.addEventListener('click', function (e) {
            var btn = e.target.closest('button[data-wcag]');
            if (btn) { handleToggle(btn, bar); }
        });
        syncButtons(bar);
    }

    /* Naprawia "[MISSING TRANSLATION]" w aria-label motywu (WCAG 4.1.2) —
       np. przycisk hamburgera bez przetłumaczonej etykiety. Czytnik
       ekranu przeczytałby dosłownie "missing translation". */
    function fixMissingTranslations () {
        document.querySelectorAll('[aria-label*="MISSING TRANSLATION"]').forEach(function (el) {
            if (el.matches('.navbar__toggle, .js-toggle')) {
                el.setAttribute('aria-label', MENU_TOGGLE_LABEL);
            } else if (el.textContent.trim()) {
                /* Element ma widoczny tekst — zepsuty aria-label jest zbędny */
                el.removeAttribute('aria-label');
            } else {
                el.setAttribute('aria-label', MENU_TOGGLE_LABEL);
            }
        });
        document.querySelectorAll('[title*="MISSING TRANSLATION"]').forEach(function (el) {
            el.removeAttribute('title');
        });
    }

    /* Mierzy efektywne tło za przyciskiem (idąc w górę drzewa DOM)
       i ustawia kontrastowy kolor ikony. Dzięki temu ikona jest
       widoczna w trybie jasnym i ciemnym niezależnie od zmiennych
       motywu. Reaguje też na zmianę trybu systemowego. */
    function ensureTriggerContrast () {
        var trigger = document.querySelector('.wcag-trigger');
        if (!trigger) { return; }
        try {
            var el = trigger;
            var bg = null;
            while (el && el !== document.documentElement) {
                var c = window.getComputedStyle(el).backgroundColor || '';
                var m = c.match(/rgba?(s*([d.]+)[,s]+([d.]+)[,s]+([d.]+)(?:[,s/]+([d.]+))?s*)/);
                if (m && (m[4] === undefined || parseFloat(m[4]) > 0.1)) {
                    bg = [parseFloat(m[1]), parseFloat(m[2]), parseFloat(m[3])];
                    break;
                }
                el = el.parentElement;
            }
            if (!bg) { bg = [255, 255, 255]; }
            var lum = (0.2126 * bg[0] + 0.7152 * bg[1] + 0.0722 * bg[2]) / 255;
            trigger.style.setProperty('--wcag-icon-color', lum > 0.5 ? '#17181E' : '#FFFFFF');
        } catch (e) {}
    }

    function prepareSkipTarget () {
        var target = document.querySelector("main")
            || document.querySelector('main')
            || document.getElementById('main-content');
        if (target) {
            if (!target.id) { target.id = 'wcag-main'; }
            if (!target.hasAttribute('tabindex')) { target.setAttribute('tabindex', '-1'); }
            var link = document.querySelector('.wcag-skip-link');
            if (link) { link.setAttribute('href', '#' + target.id); }
        }
    }

    function init () {
        /* Skip link zawsze na początek body (kolejność tabulacji) */
        if ("<a href=\"#wcag-main\" class=\"wcag-skip-link\">Przejdź do treści głównej</a>") {
            var skipWrap = document.createElement('div');
            skipWrap.innerHTML = "<a href=\"#wcag-main\" class=\"wcag-skip-link\">Przejdź do treści głównej</a>";
            var skip = skipWrap.firstElementChild;
            if (skip) { document.body.insertBefore(skip, document.body.firstChild); }
        }

        var container = document.createElement('div');
        container.innerHTML = "<button type=\"button\" class=\"wcag-trigger wcag-trigger--menu\" aria-expanded=\"false\" aria-controls=\"wcag-panel\" aria-label=\"Dostępność — otwórz panel ustawień\"><svg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 1.8a8.2 8.2 0 1 1 0 16.4 8.2 8.2 0 0 1 0-16.4z\"/><circle cx=\"12\" cy=\"7.2\" r=\"1.7\"/><path d=\"M12 9.8c-.5 0-3.4-.4-5-.8l-.4 1.5c1.3.3 3.1.6 4 .7v2.1l-1.8 5.3 1.5.5 1.6-4.7h.4l1.6 4.7 1.5-.5-1.8-5.3v-2.1c.9-.1 2.7-.4 4-.7l-.4-1.5c-1.6.4-4.5.8-5.2.8z\"/></svg></button>\n<div class=\"wcag-panel wcag-panel--menu\" id=\"wcag-panel\" role=\"group\" aria-label=\"Dostępność\" hidden>\n    <p class=\"wcag-panel__title\">Dostępność</p>\n    <button type=\"button\" data-wcag=\"hc\" aria-pressed=\"false\">Wysoki kontrast</button>\n    <button type=\"button\" data-wcag=\"text1\" aria-pressed=\"false\" aria-label=\"Powiększ tekst o jeden stopień\">Tekst A+</button>\n    <button type=\"button\" data-wcag=\"text2\" aria-pressed=\"false\" aria-label=\"Powiększ tekst o dwa stopnie\">Tekst A++</button>\n    <button type=\"button\" data-wcag=\"readable\" aria-pressed=\"false\">Czytelny tekst</button>\n    <button type=\"button\" data-wcag=\"underline\" aria-pressed=\"false\">Podkreśl linki</button>\n    <button type=\"button\" data-wcag=\"reset\">Resetuj</button>\n</div>";
        var liveWrap = document.createElement('div');
        liveWrap.innerHTML = "<span class=\"wcag-visually-hidden\" role=\"status\" aria-live=\"polite\" id=\"wcag-status\"></span>";

        if (MODE === 'menu') {
            var header = document.querySelector(HEADER_SELECTOR);

            if (header) {
                while (container.firstChild) {
                    header.appendChild(container.firstChild);
                }
            } else {
                /* Awaryjnie: brak nagłówka -> przycisk pływający */
                var trg = container.querySelector('.wcag-trigger');
                var pnl = container.querySelector('.wcag-panel');
                if (trg) { trg.className = 'wcag-trigger wcag-trigger--floating'; }
                if (pnl) { pnl.classList.remove('wcag-panel--menu'); pnl.classList.add('wcag-panel--floating'); }
                while (container.firstChild) {
                    document.body.appendChild(container.firstChild);
                }
            }
        } else if (MODE === 'top' || MODE === 'static') {
            while (container.lastChild) {
                document.body.insertBefore(container.lastChild, document.body.firstChild);
            }
        } else {
            while (container.firstChild) {
                document.body.appendChild(container.firstChild);
            }
        }

        while (liveWrap.firstChild) {
            document.body.appendChild(liveWrap.firstChild);
        }

        if (MODE === 'top' || MODE === 'bottom' || MODE === 'static') {
            setupBar();
        } else {
            setupPanel();
        }
        fixMissingTranslations();
        prepareSkipTarget();
        ensureTriggerContrast();

        /* Przelicz kolor ikony po zmianie trybu jasny/ciemny */
        if (window.matchMedia) {
            try {
                window.matchMedia('(prefers-color-scheme: dark)')
                    .addEventListener('change', ensureTriggerContrast);
            } catch (e) {}
        }
    }

    /* Wykonujemy NATYCHMIAST (skrypt jest na końcu body, DOM nad nami
       już istnieje) — dzięki temu pozycja menu trafia do .navbar__menu
       zanim odroczony skrypt motywu sklonuje menu do sidebara. */
    init();
})();</script>
