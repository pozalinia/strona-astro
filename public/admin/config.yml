  # Ukryta kolekcja – wyłącznie cel relacji (obejmuje wpisy w obu formatach)
  - name: wpisy-indeks
    label: Wszystkie wpisy
    folder: src/content/posts
    extension: md
    format: yaml-frontmatter
    hide: true
    create: false
    delete: false
    identifier_field: title
    fields:
      - name: title
        label: Tytuł
        widget: string
      - name: featured
        label: Wyróżniony
        widget: boolean
        default: false

  # ---------------------------------------------------------------------------
  # Strony
  # ---------------------------------------------------------------------------
  - name: strony
    label: Strony
    label_singular: Strona
    description: Nowe strony (np. O nas) pisane w edytorze rich text.
    folder: src/content/pages
    extension: md
    format: yaml-frontmatter
    filter:
      field: format
      value: [markdown, null]
    identifier_field: title
    slug: "{{slug}}"
    summary: "{{title}}"
